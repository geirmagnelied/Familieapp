<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FamilieApp</title>
<script>(function(){var n=new Date(),m=n.getMonth(),d=n.getDate();if(m===9||(m===10&&d<=2))document.documentElement.classList.add("halloween");})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; background: #FDEAF1; }
:root {
  --bg:#FDEAF1; --surface:#FFF5F9; --card:#FFFFFF; --border:rgba(216,27,96,0.10); --line:#F3BFD3; --purple:#C2185B;
  --text:#3A1F2D; --muted:#A27C8E; --soft:#FFF0F6;
  --pink:#F0407A; --pink-light:#FFD3E3; --pink-deep:#D81B60; --rose:#FF8FB5;
  --grey:#8C6D7C; --charcoal:#3A1F2D; --mint:#2FBF8A; --gold:#FFC233;
  --radius:16px; --shadow:0 4px 18px rgba(216,27,96,0.10);
  --font-h:'Baloo 2',sans-serif; --font-b:'Nunito',sans-serif;
}
body { font-family:var(--font-b); color:var(--text); overflow:hidden; }
.app { display:flex; flex-direction:column; height:100dvh; max-width:480px; margin:0 auto; background:var(--bg); overflow:hidden; }

#splash { position:fixed; inset:0; z-index:600; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; max-width:480px; margin:0 auto; }
.splash-title { font-family:var(--font-h); font-size:28px; font-weight:800; color:var(--charcoal); }
.spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--pink); border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

#onboarding { position:fixed; inset:0; z-index:500; background:var(--bg); display:none; flex-direction:column; align-items:center; justify-content:center; padding:40px 28px; max-width:480px; margin:0 auto; }
.ob-title { font-family:var(--font-h); font-size:26px; font-weight:800; color:var(--charcoal); text-align:center; margin-bottom:6px; }
.ob-sub { font-size:14px; color:var(--muted); text-align:center; margin-bottom:28px; font-weight:600; line-height:1.5; }
.ob-grid { display:flex; flex-direction:column; gap:9px; width:100%; }
.ob-btn { width:100%; padding:15px 18px; background:var(--card); border:2px solid var(--border); border-radius:var(--radius); font-family:var(--font-h); font-size:17px; font-weight:700; color:var(--charcoal); cursor:pointer; transition:all 0.15s; text-align:left; box-shadow:var(--shadow); }
.ob-btn.selected { border-color:var(--pink); background:var(--pink-light); color:var(--pink-deep); }
.ob-meta { font-size:12px; color:var(--muted); font-weight:600; margin-top:1px; }

#pinPad { width:100%; margin-top:20px; display:none; flex-direction:column; align-items:center; gap:14px; }
.pin-name { font-family:var(--font-h); font-size:20px; font-weight:700; color:var(--charcoal); }
.pin-dots { display:flex; gap:12px; }
.pin-dot { width:14px; height:14px; border-radius:50%; border:2px solid var(--border); background:none; transition:all 0.15s; }
.pin-dot.filled { background:var(--pink); border-color:var(--pink); }
.pin-error { font-size:13px; color:var(--pink-deep); font-weight:700; height:18px; }
.pin-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:280px; }
.pin-key { padding:16px; background:var(--card); border:1px solid var(--border); border-radius:14px; font-family:var(--font-h); font-size:22px; font-weight:700; color:var(--charcoal); cursor:pointer; text-align:center; transition:all 0.12s; box-shadow:var(--shadow); }
.pin-key:active { background:var(--pink-light); border-color:var(--pink); transform:scale(0.95); }
.pin-key.del { font-size:16px; color:var(--muted); }
.btn-back { margin-top:4px; background:none; border:none; color:var(--muted); font-family:var(--font-b); font-size:14px; font-weight:700; cursor:pointer; }

.header { background:linear-gradient(135deg,#B8445F 0%,#D4607E 55%,#E8A0B0 100%); padding:44px 18px 10px; flex-shrink:0; z-index:10; box-shadow:0 2px 12px rgba(180,60,90,0.18); }
.header-inner { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.app-title { font-family:var(--font-h); font-size:19px; font-weight:800; color:#fff; cursor:pointer; }
.header-center { flex:1; text-align:center; font-size:12px; color:rgba(255,255,255,0.8); font-weight:700; }
.user-chip { background:rgba(255,255,255,0.22); border:1px solid rgba(255,255,255,0.35); color:#fff; font-size:13px; font-weight:800; padding:5px 13px; border-radius:20px; cursor:pointer; font-family:var(--font-b); }
.header-right { display:flex; align-items:center; gap:8px; }
.hamburger-btn { background:rgba(255,255,255,0.22); border:1px solid rgba(255,255,255,0.35); color:#fff; width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

.nav { display:flex; background:var(--card); border-top:1px solid var(--border); flex-shrink:0; z-index:10; box-shadow:0 -1px 6px rgba(0,0,0,0.05); min-height:64px; overflow-x:auto; scrollbar-width:none; }
.nav::-webkit-scrollbar { display:none; }
.nav-btn { flex:1 0 auto; min-width:62px; padding:14px 8px 12px; border:none; background:none; font-family:var(--font-b); font-size:10px; font-weight:800; color:var(--muted); cursor:pointer; text-transform:uppercase; letter-spacing:0.3px; position:relative; transition:color 0.15s; line-height:1.3; white-space:nowrap; text-align:center; }
#listsNavBtn { display:flex; align-items:center; justify-content:center; }
.lists-dropup { position:fixed; transform:translate(-50%,-100%); background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:0 -4px 16px rgba(0,0,0,0.15); overflow:hidden; min-width:150px; z-index:600; }
.lists-dropup div { padding:13px 16px; font-family:var(--font-b); font-size:12px; font-weight:700; text-transform:none; letter-spacing:normal; color:var(--charcoal); cursor:pointer; border-bottom:1px solid var(--border); text-align:left; }
.lists-dropup div:last-child { border-bottom:none; }
.lists-dropup div:active { background:var(--soft); }
.nav-btn.active { color:var(--pink-deep); }
.nav-btn.active::after { content:''; position:absolute; top:0; left:20%; right:20%; height:2px; background:var(--pink-deep); border-radius:0 0 3px 3px; }

.content { flex:1; overflow-y:auto; padding:14px 14px 90px; -webkit-overflow-scrolling:touch; }

.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
.card-title { font-family:var(--font-h); font-size:16px; font-weight:700; color:var(--charcoal); margin-bottom:13px; display:flex; align-items:center; justify-content:space-between; }
.card-action { font-family:var(--font-b); font-size:13px; font-weight:700; color:var(--pink); cursor:pointer; }

.mini-score-card { display:flex; align-items:center; padding:12px 10px; }
.mini-score-item { flex:1; text-align:center; }
.mini-score-num { font-family:var(--font-h); font-size:22px; font-weight:800; color:var(--pink-deep); line-height:1; }
.mini-score-lbl { font-size:11px; color:var(--muted); font-weight:700; margin-top:2px; text-transform:uppercase; letter-spacing:0.3px; }
.mini-score-divider { width:1px; align-self:stretch; background:var(--border); }

.locked-box { text-align:center; padding:22px 14px; background:var(--soft); border-radius:12px; border:1px solid var(--border); }
.locked-title { font-family:var(--font-h); font-size:17px; font-weight:700; color:var(--charcoal); margin-bottom:6px; }
.locked-sub { font-size:13px; color:var(--muted); font-weight:600; line-height:1.5; }
.countdown { font-family:var(--font-h); font-size:26px; font-weight:800; color:var(--pink); margin:10px 0; }

/* Chores */
.chore-item { display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--border); }
.chore-item:last-child { border-bottom:none; }
.chore-info { flex:1; min-width:0; }
.chore-label { font-weight:700; font-size:14px; color:var(--charcoal); }
.chore-meta { font-size:12px; color:var(--muted); margin-top:2px; font-weight:600; }
.chore-right { display:flex; flex-direction:column; gap:5px; align-items:flex-end; flex-shrink:0; }
.btn-log { background:var(--pink); color:#fff; border:none; border-radius:10px; font-family:var(--font-b); font-weight:800; font-size:13px; padding:9px 16px; cursor:pointer; transition:all 0.15s; }
.btn-log:active { transform:scale(0.96); }
.btn-log.done { background:var(--soft); color:var(--mint); border:2px solid var(--mint); }
.min-input { width:58px; background:var(--soft); border:1px solid var(--border); color:var(--text); border-radius:9px; font-family:var(--font-b); font-size:14px; font-weight:700; padding:7px 8px; text-align:center; }
.min-input:focus { outline:none; border-color:var(--pink); }
.pts-preview { font-size:11px; color:var(--pink-deep); font-weight:800; text-align:right; }

/* Recurring task badge */
.recurring-badge { display:inline-flex; align-items:center; font-size:10px; font-weight:800; padding:2px 8px; border-radius:20px; background:rgba(232,184,75,0.15); color:#9A6A00; border:1px solid rgba(232,184,75,0.35); margin-top:3px; }

/* Tasks */
.task-item { display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--border); }
.task-item:last-child { border-bottom:none; }
.task-check { width:22px; height:22px; border-radius:7px; border:2px solid var(--border); background:none; cursor:pointer; flex-shrink:0; transition:all 0.18s; margin-top:2px; display:flex; align-items:center; justify-content:center; font-size:12px; }
.task-check.checked { background:var(--mint); border-color:var(--mint); color:#fff; }
.task-body { flex:1; }
.task-title { font-weight:700; font-size:14px; color:var(--charcoal); }
.task-title.done { text-decoration:line-through; color:var(--muted); }
.task-meta { margin-top:4px; display:flex; gap:5px; flex-wrap:wrap; }
.pill { display:inline-flex; align-items:center; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700; }
.pill-pink { background:var(--pink-light); color:var(--pink-deep); }
.pill-grey { background:var(--soft); color:var(--grey); border:1px solid var(--border); }
.pill-gold { background:rgba(232,184,75,0.15); color:#9A6A00; border:1px solid rgba(232,184,75,0.3); }

/* Shopping */
.shop-item { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border); }
.shop-item:last-child { border-bottom:none; }
.shop-check { width:22px; height:22px; border-radius:50%; border:2px solid var(--border); background:none; cursor:pointer; flex-shrink:0; transition:all 0.18s; display:flex; align-items:center; justify-content:center; font-size:12px; }
.shop-check.checked { background:var(--pink); border-color:var(--pink); color:#fff; }
.shop-label { flex:1; font-size:14px; font-weight:600; color:var(--charcoal); }
.shop-label.done { text-decoration:line-through; color:var(--muted); }
.shop-qty { font-size:12px; color:var(--muted); font-weight:700; }
.prog-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.prog-bg { flex:1; height:4px; background:var(--border); border-radius:4px; overflow:hidden; }
.prog-fill { height:100%; background:linear-gradient(90deg,var(--pink-light),var(--pink)); border-radius:4px; transition:width 0.4s; }
.prog-text { font-size:12px; font-weight:800; color:var(--muted); white-space:nowrap; }
.add-row { display:flex; gap:8px; margin-top:10px; }
.add-input { flex:1; background:var(--soft); border:1.5px solid var(--border); color:var(--text); border-radius:10px; font-family:var(--font-b); font-size:14px; padding:9px 12px; }
.add-input:focus { outline:none; border-color:var(--pink); }
.search-input { width:100%; background:var(--soft); border:1.5px solid var(--border); color:var(--text); border-radius:10px; font-family:var(--font-b); font-size:14px; padding:10px 12px; }
.search-input:focus { outline:none; border-color:var(--pink); }
.recipe-row { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border); cursor:pointer; }
.recipe-row:last-child { border-bottom:none; }
.recipe-row-title { font-weight:700; font-size:14px; color:var(--charcoal); }
.recipe-row-hint { color:var(--muted); font-size:16px; }
.recipe-detail-text { font-size:13px; color:var(--charcoal); font-weight:600; line-height:1.6; white-space:pre-wrap; }
.recipe-pick-row { display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); cursor:pointer; font-size:13px; font-weight:700; color:var(--charcoal); }
.recipe-pick-row:last-child { border-bottom:none; }
.recipe-pick-list { max-height:160px; overflow-y:auto; margin-top:6px; border:1px solid var(--border); border-radius:10px; padding:0 10px; background:var(--soft); }
.wishlist-row { display:flex; align-items:flex-start; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); }
.wishlist-row:last-child { border-bottom:none; }
.wishlist-info { flex:1; min-width:0; }
.wishlist-title { font-weight:700; font-size:14px; color:var(--charcoal); }
.wishlist-note { font-size:12px; color:var(--muted); font-weight:600; margin-top:2px; }
.wishlist-claim { font-size:11px; font-weight:800; color:var(--mint); margin-top:6px; }
.wishlist-claim.mine { color:var(--pink-deep); }
.wishlist-unclaim { text-decoration:underline; cursor:pointer; margin-left:6px; }
.dice-row { display:flex; gap:8px; margin-bottom:14px; }
.dice-btn { flex:1; padding:12px 0; border-radius:12px; border:2px solid var(--border); background:var(--soft); font-family:var(--font-h); font-size:18px; font-weight:800; color:var(--muted); cursor:pointer; transition:all 0.15s; }
.dice-btn.active { background:var(--pink-light); color:var(--pink-deep); border-color:var(--pink); }
.df-label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin:2px 0 8px; }
.df-member { padding:12px 0; border-bottom:1px solid var(--border); }
.df-member:last-child { border-bottom:none; }
.df-member-head { display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px; color:var(--charcoal); }
.df-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.df-rating { margin-left:auto; font-size:11px; font-weight:800; padding:3px 10px; border-radius:20px; }
.df-flags { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.df-flag { font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; background:var(--soft); color:var(--charcoal); border:1px solid var(--border); }
.df-note { font-size:13px; font-weight:600; color:var(--charcoal); margin-top:7px; line-height:1.45; white-space:pre-wrap; }
.df-empty { font-size:12px; font-weight:600; color:var(--muted); margin-top:4px; }
.df-edit-link { font-size:12px; font-weight:800; color:var(--pink); cursor:pointer; margin-left:8px; text-decoration:underline; }
.bday-name { font-weight:800; }
.wishlist-claim-btn { margin-top:6px; background:var(--pink-light); color:var(--pink-deep); border:1.5px solid var(--pink); border-radius:14px; font-family:var(--font-b); font-size:11px; font-weight:800; padding:5px 12px; cursor:pointer; }
.btn-sm { background:var(--pink); color:#fff; border:none; border-radius:10px; font-family:var(--font-b); font-weight:800; font-size:18px; width:40px; cursor:pointer; }

/* Admin */
.admin-note { font-size:13px; color:var(--muted); font-weight:600; margin-bottom:12px; padding:10px 12px; background:var(--soft); border-radius:10px; line-height:1.5; }
.admin-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
.admin-row:last-of-type { border-bottom:none; }
.admin-name { flex:1; font-weight:700; font-size:14px; color:var(--charcoal); }
.admin-meta { font-size:12px; color:var(--muted); font-weight:600; text-align:right; }
.btn-del { background:none; border:1px solid var(--border); color:var(--muted); border-radius:8px; font-size:12px; font-weight:800; padding:4px 10px; cursor:pointer; font-family:var(--font-b); flex-shrink:0; }
.btn-del:active { background:var(--pink-light); color:var(--pink-deep); border-color:var(--pink); }

.admin-section-title { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); margin:16px 0 8px; }

.fab { position:fixed; bottom:76px; right:18px; width:52px; height:52px; background:var(--pink-deep); border:none; border-radius:50%; font-size:26px; color:#fff; cursor:pointer; box-shadow:0 4px 16px rgba(180,60,90,0.35); display:none; align-items:center; justify-content:center; z-index:50; }
.fab:active { transform:scale(0.93); }

.backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.38); backdrop-filter:blur(3px); z-index:200; display:flex; align-items:flex-end; justify-content:center; animation:bdin 0.18s; }
@keyframes bdin { from{opacity:0} to{opacity:1} }
.sheet { background:var(--card); border-radius:22px 22px 0 0; width:100%; max-width:480px; padding:16px 18px 38px; max-height:90vh; overflow-y:auto; animation:sheetup 0.25s cubic-bezier(0.32,0.72,0,1); }
@keyframes sheetup { from{transform:translateY(100%)} to{transform:translateY(0)} }
.sheet-handle { width:34px; height:3px; background:var(--border); border-radius:3px; margin:0 auto 14px; }
.sheet-title { font-family:var(--font-h); font-size:18px; font-weight:700; color:var(--charcoal); margin-bottom:14px; }
.field { margin-bottom:12px; }
.field label { display:block; font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
.field input,.field select,.field textarea { width:100%; background:var(--soft); border:1.5px solid var(--border); color:var(--text); border-radius:11px; font-family:var(--font-b); font-size:15px; padding:11px 13px; }
.field input:focus,.field select:focus,.field textarea:focus { outline:none; border-color:var(--pink); }
.field textarea { resize:none; height:72px; }
.field-row { display:flex; gap:10px; }
.field-row .field { flex:1; }
.type-row { display:flex; gap:6px; flex-wrap:wrap; }
.type-chip { padding:6px 13px; border-radius:20px; font-size:12px; font-weight:700; border:2px solid var(--border); cursor:pointer; font-family:var(--font-b); background:var(--soft); color:var(--muted); transition:all 0.15s; }
.type-chip.active { background:var(--pink-light); color:var(--pink-deep); border-color:var(--pink); }
.btn-save { width:100%; background:var(--pink-deep); color:#fff; border:none; border-radius:12px; font-family:var(--font-h); font-size:17px; font-weight:800; padding:15px; cursor:pointer; margin-top:6px; }
.btn-save:active { transform:scale(0.98); }
.btn-cancel-s { width:100%; background:none; border:1.5px solid var(--border); color:var(--muted); border-radius:12px; font-family:var(--font-b); font-size:14px; font-weight:700; padding:12px; cursor:pointer; margin-top:8px; }
.hint { font-size:12px; color:var(--muted); font-weight:600; line-height:1.5; margin-bottom:12px; }

#fridayShow { position:fixed; inset:0; z-index:400; background:#1A0A10; display:none; flex-direction:column; align-items:center; padding:60px 22px 40px; overflow-y:auto; max-width:480px; margin:0 auto; }
#fridayShow.visible { display:flex; }
.show-title { font-family:var(--font-h); font-size:26px; font-weight:800; color:#fff; text-align:center; margin-bottom:4px; opacity:0; animation:fadein 0.8s 0.3s forwards; }
.show-sub { font-size:13px; color:rgba(255,255,255,0.45); text-align:center; margin-bottom:36px; font-weight:600; opacity:0; animation:fadein 0.8s 0.6s forwards; }
@keyframes fadein { to{opacity:1} }
.show-bars { width:100%; display:flex; flex-direction:column; gap:16px; }
.show-bar-row { opacity:0; }
.show-bar-row.revealed { animation:slidein 0.55s cubic-bezier(.2,.8,.3,1) forwards; }
@keyframes slidein { from{opacity:0;transform:translateX(-20px)} to{opacity:1;transform:none} }
.show-bar-name { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
.show-name { font-family:var(--font-h); font-size:17px; font-weight:700; color:#fff; }
.show-pts { font-family:var(--font-h); font-size:20px; font-weight:800; color:var(--rose); }
.show-bar-bg { height:16px; background:rgba(255,255,255,0.07); border-radius:8px; overflow:hidden; }
.show-bar-fill { height:100%; border-radius:8px; background:linear-gradient(90deg,var(--pink-deep),var(--rose)); width:0%; transition:width 1.1s cubic-bezier(.4,0,.2,1); }
.winner-reveal { margin-top:44px; text-align:center; width:100%; opacity:0; }
.winner-reveal.show { animation:pulsein 0.85s 0.2s cubic-bezier(.2,.8,.3,1) forwards; }
@keyframes pulsein { 0%{opacity:0;transform:scale(0.75)} 70%{transform:scale(1.05)} 100%{opacity:1;transform:scale(1)} }

.toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--pink-deep); color:#fff; font-family:var(--font-b); font-weight:800; font-size:14px; padding:10px 22px; border-radius:22px; z-index:300; white-space:nowrap; box-shadow:0 4px 16px rgba(180,60,90,0.32); animation:toastpop 2.8s forwards; }

/* ── Chat ── */
.chat-wrap { display:flex; flex-direction:column; height:100%; }
.chat-messages { flex:1; overflow-y:auto; padding:4px 2px 8px; display:flex; flex-direction:column; gap:8px; }
.chat-day-divider { text-align:center; font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin:14px 0 6px; }

.chat-time { font-size:10px; color:var(--muted); font-weight:600; margin-top:2px; padding:0 4px; }
.chat-input-row { display:flex; gap:8px; padding:10px 0 0; flex-shrink:0; }

.chat-send { background:var(--pink-deep); color:#fff; border:none; border-radius:50%; width:44px; height:44px; font-size:18px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.chat-send:active { transform:scale(0.93); }
.chat-empty { text-align:center; padding:40px 16px; color:var(--muted); font-size:14px; font-weight:600; }

/* ── Date picker for past-day logging ── */

/* ── Version badge ── */

/* ── Dinner / dagskort på Dashboard ── */
.today-card { background:linear-gradient(135deg,#FDF0F4 0%,#FAE8EE 100%); border:1.5px solid var(--pink); padding:14px 16px 16px; }

.card, .sheet, .ob-btn, .pin-key, .nav, .lists-dropup, .locked-box, .idea-card, .today-card,

/* Halloween (vert slått på automatisk 1. oktober–2. november via klassen .halloween på <html>) */
@keyframes bat-fly { 0% { transform:translate(-30px,0) scale(0.8); } 50% { transform:translate(160px,8px) scale(1.1); } 100% { transform:translate(380px,-4px) scale(0.8); } }
@keyframes spider-swing { 0%,100% { transform:rotate(7deg); } 50% { transform:rotate(-7deg); } }
@keyframes pumpkin-bob { 0%,100% { transform:translateY(0) rotate(-4deg); } 50% { transform:translateY(-3px) rotate(4deg); } }
.halloween .header::before { content:'🦇'; position:absolute; top:10px; left:0; font-size:16px; opacity:0.55; animation:bat-fly 16s linear infinite; pointer-events:none; }

@media (prefers-reduced-motion: reduce) { .halloween .header::before, .halloween .header::after, .halloween .app-title::before, .halloween .today-card::after { animation:none; } }

/* ── Check if a recurring task falls in the current week ── */
function isThisWeek(task, refDate) {
  const now = refDate || new Date();
  // Start/end of current week (Monday–Sunday)
  const dayOfWeek = now.getDay() || 7; // 1=Mon, 7=Sun
  const monday = new Date(now); monday.setDate(now.getDate() - dayOfWeek + 1); monday.setHours(0,0,0,0);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23,59,59,999);

  const type = task.recurrence_type;

  if (type === 'once') {
    if (!task.once_date) return false;
    const d = new Date(task.once_date);
    return d >= monday && d <= sunday;
  }

  if (type === 'yearly') {
    // Check if the yearly date (month/day) falls within this week
    const m = task.month - 1; // 0-indexed
    const day = task.day_of_month;
    // This year
    const thisYear = new Date(now.getFullYear(), m, day);
    if (thisYear >= monday && thisYear <= sunday) return true;
    // Next year edge case (week crossing year boundary)
    const nextYear = new Date(now.getFullYear()+1, m, day);
    return nextYear >= monday && nextYear <= sunday;
  }

  if (type === 'monthly') {
    // Same day each month — check if that day is in this week
    const day = task.day_of_month;
    // Current month
    const thisMonth = new Date(now.getFullYear(), now.getMonth(), day);
    if (thisMonth >= monday && thisMonth <= sunday) return true;
    // Next month
    const nextMonth = new Date(now.getFullYear(), now.getMonth()+1, day);
    return nextMonth >= monday && nextMonth <= sunday;
  }

  if (type === 'interval_months') {
    if (!task.start_date || !task.interval_n) return false;
    const start = new Date(task.start_date);
    // Find the closest occurrence on or after start
    let cur = new Date(start);
    while (cur <= sunday) {
      if (cur >= monday && cur <= sunday) return true;
      cur.setMonth(cur.getMonth() + task.interval_n);
    }
    return false;
  }

  if (type === 'interval_weeks') {
    if (!task.start_date || !task.interval_n) return false;
    const start = new Date(task.start_date);
    let cur = new Date(start);
    while (cur <= sunday) {
      if (cur >= monday && cur <= sunday) return true;
      cur.setDate(cur.getDate() + task.interval_n * 7);
    }
    return false;
  }

  if (type === 'weekly') {
    // day_of_week: 1=Mon…7=Sun (ISO)
    const iso = task.day_of_week; // stored as 1-7
    const target = new Date(monday);
    target.setDate(monday.getDate() + (iso - 1));
    return target >= monday && target <= sunday;
  }

  return false;
}

function recurrenceLabel(task) {
  const t = task.recurrence_type;
  const MONTH_NAMES = ['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
  if (t==='yearly') return `Kvart år ${task.day_of_month}. ${MONTH_NAMES[task.month-1]}`;
  if (t==='monthly') return `Kvar månad ${task.day_of_month}.`;
  if (t==='interval_months') return `Kvar ${task.interval_n}. månad`;
  if (t==='interval_weeks') return `Kvar ${task.interval_n}. veke`;
  if (t==='weekly') { const WD=['','man','tys','ons','tor','fre','lau','søn']; return `Kvar ${WD[task.day_of_week]}`; }
  if (t==='once' && task.once_date) return `Eingong: ${task.once_date}`;
  return t;
}

const DEFAULT_DINNER_TIME = '17:00'; // vist når ein middag ikkje har eige klokkeslett
const DINNER_GRACE_MIN = 60;         // forsiden byter til neste dags middag når middagen er over (tidspunkt + dette)
let dashDayOffset = null;            // null = automatisk (i dag, eller i morgon når middagen er over); elles 0–6 dagar fram

  dashDayOffset = Math.max(0, Math.min(6, dashEffOffset+delta));

}
function dinnerTimeStr(rec){ return rec && rec.dinner_time ? rec.dinner_time.slice(0,5) : DEFAULT_DINNER_TIME; }
function dinnerPassed(rec){
  const [h,m] = dinnerTimeStr(rec).split(':').map(Number);
  const limit = new Date(); limit.setHours(h, m+DINNER_GRACE_MIN, 0, 0);
  return new Date() > limit;
}
function dinnerNotesHtml(rec){
  if(!rec || !rec.notes) return '';
  const n = rec.notes.trim();
  return /^https:\/\/\S+$/.test(n)
    ? `<div class="today-notes"><a href="${escapeAttr(n)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Sjå oppskrift</a></div>`
    : `<div class="today-notes">${escapeHtml(rec.notes)}</div>`;
}
function dinnerPhotoHtml(rec){
  if(!rec || !rec.meal) return '';
  const u = rec.image_url;
  if(u && /^(data:image\/|https:\/\/)/.test(u)) return `<img class="dinner-photo" src="${escapeAttr(u)}" alt="">`;
  const idea = ideaFor(rec.meal);
  return `<div class="dinner-photo dinner-emoji">${escapeHtml(idea ? idea.emoji : '🍽️')}</div>`;
}

  const myWeek=allLogs.filter(l=>weekKey(new Date(l.created_at))===wk).reduce((a,l)=>a+l.pts,0);
  const myToday=allLogs.filter(l=>l.created_at.slice(0,10)===dateStr()).reduce((a,l)=>a+l.pts,0);

  await loadDinnerIdeas();

  // Middagskort — éin dag om gongen. Når middagstida er over, vert neste dags middag vist.
  let dinnerCard = '';
  try {
    const todayStr = localDateStr(new Date());
    const todayRec = (await sb(`dinners?date=eq.${todayStr}&select=*`))[0] || null;
    const eff = dashDayOffset===null ? (dinnerPassed(todayRec) ? 1 : 0) : dashDayOffset;
    dashEffOffset = eff;
    const d = new Date(); d.setDate(d.getDate()+eff);
    const ds = localDateStr(d);
    const dRec = eff===0 ? todayRec : ((await sb(`dinners?date=eq.${ds}&select=*`))[0] || null);
    const cook = dRec && dRec.cook_id ? members.find(m=>m.id===dRec.cook_id) : null;
    const hasPlan = dRec && (dRec.meal || dRec.cook_id);
    const DOW=['søndag','måndag','tysdag','onsdag','torsdag','fredag','laurdag'];
    const dayLabel = eff===0 ? 'I dag' : eff===1 ? 'I morgon' : `${DOW[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}`;

    dinnerCard = `
    <div class="card today-card">
      <div class="today-nav">
        <button class="date-arrow" onclick="shiftDashDay(-1)" ${eff===0?'disabled':''}>‹</button>
        <div class="today-daylabel">${dayLabel}</div>
        <button class="date-arrow" onclick="shiftDashDay(1)" ${eff>=6?'disabled':''}>›</button>
      </div>
      <div class="today-label">Middag</div>
      ${dinnerPhotoHtml(dRec)}
      <div class="today-meal ${hasPlan && dRec.meal ? '' : 'empty'}">${hasPlan && dRec.meal ? escapeHtml(dRec.meal) : 'Ingen middag planlagt'}</div>
      ${hasPlan ? `<div class="today-time">kl. ${dinnerTimeStr(dRec)}</div>` : ''}
      ${cook ? `<div class="today-cook">${cook.name} lagar</div>` : (hasPlan ? `<div class="today-cook" style="opacity:0.6">Ingen kokk enno</div>` : '')}
      ${dinnerNotesHtml(dRec)}
      ${dRec && dRec.recipe_id ? `<div class="today-cook" style="cursor:pointer;text-decoration:underline" onclick="openRecipeDetail('${dRec.recipe_id}')">Sjå oppskrift</div>` : ''}
      <div class="today-btn-row">
        <button class="today-action today-action-ghost" onclick="showIdeas()">Vis middagsforslag</button>
        <button class="today-action" onclick="openDinnerModal('${ds}')">${hasPlan ? 'Endre plan' : 'Planlegg'}</button>
      </div>
    </div>`;
  } catch(e) { dinnerCard = ''; }

  // Poengtavla er lite brukt: éi tynn linje heilt nederst
  const scoreBar = `
  <div class="card score-mini">
    <span>Poeng</span>
    <span><b>${myToday}</b> i dag</span>
    <span><b>${myWeek}</b> denne veka</span>
    ${isFridayReveal()
      ? `<button class="score-mini-btn" onclick="showFridayReveal()">Sjå poengtavla</button>`
      : `<span>· skjult til fre. kl. 18 (<span id="countdown">—</span>)</span>`}
  </div>`;

  setTimeout(updateCountdown,100);
  return `
  ${dinnerCard}
  ${scoreBar}`;
}

/* ── KALENDER (dag-visning: middag + aktivitetar) ── */
function localDateStr(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtHM(t){ return t ? t.slice(0,5) : ''; }
const TIME_LIST_START_HOUR = 8; // lista startar kl. 08:00 (mindre skrolling), natta kjem sist
function timeSelectOptions(selected){
  let html = `<option value="">—</option>`;
  const sel = selected ? selected.slice(0,5) : '';
  let found = !sel;
  for(let i=0; i<24*4; i++){
    const h = (TIME_LIST_START_HOUR + Math.floor(i/4)) % 24, m = (i%4)*15;
    const v = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    if(v===sel) found = true;
    html += `<option value="${v}" ${v===sel?'selected':''}>${v}</option>`;
  }
  // Eksisterande klokkeslett utanfor kvartera (t.d. 08:35 frå skuleplan) må framleis vise att
  if(!found) html += `<option value="${sel}" selected>${sel}</option>`;
  return html;
}
const DURATION_OPTIONS = [15,30,45,60,75,90,105,120,150,180,240,300,360,480];
function fmtDuration(min){
  if(min<60) return `${min} min`;
  const h = Math.floor(min/60), m = min%60;
  return m ? `${h} t ${m} min` : `${h} t`;
}
function durationSelectOptions(selectedMin){
  let html = `<option value="">—</option>`;
  DURATION_OPTIONS.forEach(d=>{ html += `<option value="${d}" ${d===selectedMin?'selected':''}>${fmtDuration(d)}</option>`; });
  return html;
}
function hmToMin(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function minToHm(n){ return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`; }
function timeFieldsHtml(p, start, end, optional){
  const s = start ? start.slice(0,5) : '', e = end ? end.slice(0,5) : '';
  const dur = s && e && e>s ? hmToMin(e)-hmToMin(s) : null;
  const sfx = optional ? ' (valfritt)' : '';
  return `
      <div class="field-row">
        <div class="field"><label>Frå kl.${sfx}</label><select id="${p}Start" onchange="timeSync('${p}','start')">${timeSelectOptions(s)}</select></div>
        <div class="field"><label>Til kl.${sfx}</label><select id="${p}End" onchange="timeSync('${p}','end')">${timeSelectOptions(e)}</select></div>
      </div>
      <div class="field"><label>Varigheit (valfritt)</label><select id="${p}Dur" onchange="timeSync('${p}','dur')">${durationSelectOptions(dur)}</select></div>`;
}
// Held Frå/Til/Varigheit i synk: start+varigheit gir sluttid, og sluttid gir varigheit.
function timeSync(p, changed){
  const sEl = document.getElementById(p+'Start'), eEl = document.getElementById(p+'End'), dEl = document.getElementById(p+'Dur');
  if(!sEl || !eEl || !dEl) return;
  const dur = dEl.value ? Number(dEl.value) : null;
  if(changed==='end'){
    const ok = sEl.value && eEl.value && eEl.value>sEl.value && DURATION_OPTIONS.includes(hmToMin(eEl.value)-hmToMin(sEl.value));
    dEl.value = ok ? String(hmToMin(eEl.value)-hmToMin(sEl.value)) : '';
    return;
  }
  if(changed==='start' && !dur){
    // Ingen varigheit vald: flytt ikkje sluttid, men nullstill ugyldig sluttid
    if(sEl.value && eEl.value && eEl.value<=sEl.value) eEl.value='';
    return;
  }
  if(!dur || !sEl.value) return;
  const endMin = Math.min(hmToMin(sEl.value)+dur, 23*60+45); // held seg innanfor same dag
  const v = minToHm(endMin);
  if(![...eEl.options].some(o=>o.value===v)) eEl.add(new Option(v,v));
  eEl.value = v;
  if(hmToMin(sEl.value)+dur > 23*60+45) dEl.value='';
}

async function fetchExternalDayEvents(ds){

/* ── MIDDAGSFORSLAG (fylt ut kvar fredag av ein planlagd Claude-jobb frå matprat.no) ── */
const SUGGESTION_KIND_LABEL = { vegetar:'Vegetar', fisk:'Fisk', kylling:'Kylling', 'kjøtt':'Kjøtt', pasta:'Pasta', anna:'' };
let dinnerSuggestions = [];
function mondayOfStr(d){
  const x = new Date(d); x.setHours(12,0,0,0);
  x.setDate(x.getDate() - ((x.getDay()+6)%7));
  return localDateStr(x);
}
async function fetchDinnerSuggestionsHtml(){
  let rows = [];
  try { rows = await sb(`dinner_suggestions?week_start=gte.${mondayOfStr(new Date())}&select=*&order=week_start.desc,created_at.asc`); } catch(e) {}
  if(!rows.length){ dinnerSuggestions = []; return ''; }
  const wk = rows[0].week_start;
  dinnerSuggestions = rows.filter(r=>r.week_start===wk);
  const wd = new Date(wk+'T12:00:00');
  const cards = dinnerSuggestions.map(r=>{
    const safeUrl = r.url && r.url.startsWith('https://') ? r.url : '#';
    const meta = [SUGGESTION_KIND_LABEL[r.kind]||r.kind, r.info].filter(Boolean).join(' · ');
    const img = r.image_url && r.image_url.startsWith('https://') ?`<img class="sugg-thumb" src="${escapeAttr(r.image_url)}" alt="" loading="lazy">` : '';

      ? `<a class="sugg-title" onclick="openSuggestionDetail('${r.id}')">${escapeHtml(r.title)}</a>`

    <div class="sugg-label">Forslag til middag${dinnerSuggestions.length>1?' · sveip →':''}</div>

function suggUpdateDots(tr){

function pickSuggestion(id){

const ACTIVITY_REPEAT_DEFAULT_MONTHS = { daily:2, weekly:6, monthly:12, yearly:60 };
const ACTIVITY_REPEAT_MAX_OCCURRENCES = 366;

      </div>

      <button class="btn-cancel-s" onclick="closeModal()">Avbryt</button>

function onActRepeatChange(){
  const repeat = document.getElementById('actRepeat')?.value;
  const wrap = document.getElementById('actRepeatUntilWrap');
  if(!wrap) return;
  if(!repeat || repeat==='none'){ wrap.style.display='none'; return; }
  wrap.style.display='';
  const untilInput = document.getElementById('actRepeatUntil');
  if(untilInput && !untilInput.value){
    const dateVal = document.getElementById('actDate')?.value || localDateStr(new Date());
    const d = new Date(dateVal+'T12:00:00');
    d.setMonth(d.getMonth() + (ACTIVITY_REPEAT_DEFAULT_MONTHS[repeat]||6));
    untilInput.value = localDateStr(d);
  }
}
function buildRecurrenceRows({child,date,endDate,start,end,title,note,repeat,repeatUntil}){
  const base = { child, start_time:start, end_time:end||start, title, note };
  const d0 = new Date(date+'T12:00:00');
  const spanDays = endDate ? Math.round((new Date(endDate+'T12:00:00') - d0) / 86400000) : 0;
  if(repeat==='none') return { rows:[{...base, date, end_date: endDate||date}], capped:false };
  const recurrence_id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);
  const dEnd = new Date((repeatUntil||date)+'T12:00:00');
  const rows = [];
  let capped = false;
  for(let i=0;i<ACTIVITY_REPEAT_MAX_OCCURRENCES;i++){
    const d = new Date(d0);
    if(repeat==='daily')   d.setDate(d0.getDate()+i);
    if(repeat==='weekly')  d.setDate(d0.getDate()+i*7);
    if(repeat==='monthly') d.setMonth(d0.getMonth()+i);
    if(repeat==='yearly')  d.setFullYear(d0.getFullYear()+i);
    if(d>dEnd){ break; }
    const dE = new Date(d); dE.setDate(d.getDate()+spanDays);
    rows.push({...base, date: localDateStr(d), end_date: localDateStr(dE), recurrence_id, recurrence_rule: repeat});
    if(i===ACTIVITY_REPEAT_MAX_OCCURRENCES-1) capped = true;
  }
  return { rows, capped };
}

  const {rows, capped} = buildRecurrenceRows({child,date,endDate,start,end,title,note,repeat,repeatUntil});

function resizeImageToDataUrl(file, max, quality){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const k = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('bilete')); };
    img.src = url;
  });
}
async function dinnerPhotoPicked(input){
  const f = input.files && input.files[0];
  if(!f) return;
  try {
    document.getElementById('dImage').value = await resizeImageToDataUrl(f, 800, 0.72);
    dinnerPhotoPreview();
  } catch(e) { toast('Kunne ikkje lese biletet'); }
}

function dinnerPhotoPreview(){
  const prev = document.getElementById('dPhotoPrev'), val = document.getElementById('dImage')?.value;

    : '';
}

function escapeAttr(str){
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── STATS / GRAF ── */
let statsPeriod = 'w8'; // w4, w8, w12, m6, m12

function statsPeriodConfig(p){
  if (p==='w4')  return {unit:'week',  count:4};
  if (p==='w8')  return {unit:'week',  count:8};
  if (p==='w12') return {unit:'week',  count:12};
  if (p==='m6')  return {unit:'month', count:6};
  if (p==='m12') return {unit:'month', count:12};
  return {unit:'week', count:8};
}

function setStatsPeriod(p){ statsPeriod=p; renderTab('stats'); }

async function renderStats(){
  const cfg = statsPeriodConfig(statsPeriod);
  const now = new Date();
  const currentWk = weekKey(now);
  const fridayUnlocked = isFridayReveal();

  // Build list of period buckets (oldest to newest)
  const buckets = []; // {key, label, isCurrentAndLocked}
  if (cfg.unit==='week') {
    for (let i=cfg.count-1; i>=0; i--) {
      const d = new Date(now); d.setDate(d.getDate() - i*7);
      const key = weekKey(d);
      const locked = (key===currentWk) && !fridayUnlocked;
      buckets.push({ key, label:'V'+weekNum(d), locked });
    }
  } else {
    for (let i=cfg.count-1; i>=0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const key = monthKey(d);
      const isCurrentMonth = (key===monthKey(now));
      const locked = isCurrentMonth && !fridayUnlocked;
      const MN=['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
      buckets.push({ key, label:MN[d.getMonth()], locked });
    }
  }

  // Fetch all logs once
  const logs = await sb('chore_logs?select=user_id,pts,created_at');

  // Aggregate per member per bucket
  const series = members.map(m => {
    const values = buckets.map(b => {
      if (b.locked) return null; // hidden
      const sum = logs.filter(l => l.user_id===m.id && (cfg.unit==='week' ? weekKey(new Date(l.created_at))===b.key : monthKey(new Date(l.created_at))===b.key)).reduce((a,l)=>a+l.pts,0);
      return sum;
    });
    return { member:m, values };
  });

  const maxVal = Math.max(1, ...series.flatMap(s=>s.values.filter(v=>v!==null)));

  const periodButtons = [
    {v:'w4',l:'4 v'},{v:'w8',l:'8 v'},{v:'w12',l:'12 v'},{v:'m6',l:'6 mnd'},{v:'m12',l:'12 mnd'}
  ].map(p=>`<button class="stats-period-btn ${statsPeriod===p.v?'active':''}" onclick="setStatsPeriod('${p.v}')">${p.l}</button>`).join('');

  const svg = buildLineChartSVG(buckets, series, maxVal);

  const totals = members.map(m=>{
    const total = buckets.reduce((sum,b,i)=>{
      const v = series.find(s=>s.member.id===m.id)?.values[i];
      return sum + (v||0);
    },0);
    return {member:m, total};
  }).sort((a,b)=>b.total-a.total);

  const lockedCount = buckets.filter(b=>b.locked).length;

  return `<div class="card">
    <div class="card-title">Poengutvikling</div>
    <div class="stats-period-row">${periodButtons}</div>
    <div class="stats-svg-wrap">${svg}</div>
    ${lockedCount>0?`<div class="stats-locked-note">Denne ${cfg.unit==='week'?'veka':'månaden'} er skjult til fredag kl. 18</div>`:''}
    <div class="stats-legend">
      ${members.map(m=>`<div class="stats-legend-item"><span class="stats-legend-dot" style="background:${memberColor(m.id)}"></span>${m.name}</div>`).join('')}
    </div>
  </div>
  <div class="card">
    <div class="card-title">Totalt i perioden</div>
    <div class="stats-totals">
      ${totals.map(t=>`
        <div class="stats-total-row">
          <span class="stats-total-dot" style="background:${memberColor(t.member.id)}"></span>
          <span class="stats-total-name">${t.member.name}</span>
          <span class="stats-total-num">${t.total} p</span>
        </div>`).join('')}
    </div>
  </div>`;
}

function buildLineChartSVG(buckets, series, maxVal){
  const W = Math.max(320, buckets.length*56);
  const H = 220;
  const padL = 36, padR = 14, padT = 14, padB = 28;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const n = buckets.length;
  const xStep = n>1 ? plotW/(n-1) : 0;

  const xFor = i => padL + i*xStep;
  const yFor = v => padT + plotH - (v/maxVal)*plotH;

  // Grid lines (horizontal, 4 lines)
  let gridHtml = '';
  for (let g=0; g<=4; g++){
    const gy = padT + plotH - (g/4)*plotH;
    const val = Math.round((g/4)*maxVal);
    gridHtml += `<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="var(--border)" stroke-width="1"/>`;
    gridHtml += `<text x="${padL-6}" y="${gy+3}" font-size="9" fill="var(--muted)" text-anchor="end" font-family="Nunito">${val}</text>`;
  }

  // X labels
  let labelHtml = '';
  buckets.forEach((b,i)=>{
    labelHtml += `<text x="${xFor(i)}" y="${H-8}" font-size="10" fill="var(--muted)" text-anchor="middle" font-family="Nunito" font-weight="700">${b.label}</text>`;
  });

  // Lines per member — skip null (locked) points by breaking the path
  let linesHtml = '';
  series.forEach(s => {
    const color = memberColor(s.member.id);
    let pathSegs = [];
    let current = [];
    s.values.forEach((v,i) => {
      if (v===null) {
        if (current.length) { pathSegs.push(current); current=[]; }
      } else {
        current.push([xFor(i), yFor(v)]);
      }
    });
    if (current.length) pathSegs.push(current);

    pathSegs.forEach(seg => {
      const d = seg.map((pt,idx)=> (idx===0?'M':'L') + pt[0].toFixed(1) + ',' + pt[1].toFixed(1)).join(' ');
      linesHtml += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
      seg.forEach(pt => {
        linesHtml += `<circle cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="3.5" fill="${color}"/>`;
      });
    });
  });

  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="display:block">
    ${gridHtml}
    ${linesHtml}
    ${labelHtml}
  </svg>`;
}

function updateCountdown(){
  const el=document.getElementById('countdown');if(!el)return;
  const now=new Date();const d=now.getDay();
  const fri=new Date(now);fri.setDate(now.getDate()+(d<=5?5-d:6));fri.setHours(18,0,0,0);
  const diff=fri-now;if(diff<=0){el.textContent='No!';return;}
  const h=Math.floor(diff/3600000);const m=Math.floor((diff%3600000)/60000);
  el.textContent=h>24?`${Math.floor(h/24)}d ${h%24}t`:`${h}t ${m}m`;
  setTimeout(updateCountdown,30000);
}

async function showFridayReveal(){
  const wk=weekKey();
  const logs=await sb(`chore_logs?select=user_id,pts,created_at`);
  const scores=members.map(m=>({
    ...m,week:logs.filter(l=>l.user_id===m.id&&weekKey(new Date(l.created_at))===wk).reduce((a,l)=>a+l.pts,0)
  })).sort((a,b)=>b.week-a.week);
  const maxPts=Math.max(...scores.map(s=>s.week),1);
  const winner=scores[0];
  document.getElementById('showWeekNum').textContent=weekNum();
  document.getElementById('showBars').innerHTML=scores.map((s,i)=>`
    <div class="show-bar-row" id="sbar_${i}">

      <div class="show-bar-bg"><div class="show-bar-fill" id="sbfill_${i}"></div></div>

    ${honors.map((s,i)=>`<div class="honor-row">${i===0?'2.':'3.'} ${s.name} — ${s.week} poeng</div>`).join('')}

function shiftLogDate(deltaDays){
  const d = new Date(selectedLogDate);

  if (d > todayD) return;
  selectedLogDate = dateStr(d);

function logDateLabel(){

let shopShowDone = false;
const shopPending = {}; // itemId -> timeoutId (kryssa av, men ikkje lagra enno — angre-vindauge)
const SHOP_UNDO_MS = 4000;

function toggleShopShowDone(){
  shopShowDone = !shopShowDone;
  renderTab('shopping');
}

async function renderShopping(){
  const lists=await sb(`shopping_lists?select=*,shopping_items(*)&order=created_at.desc`);
  if(!lists.length)return`<div class="empty"><p>Ingen handlelister.<br>Trykk + for å opprette.</p></div>`;
  const toggleHtml = `<div class="type-row" style="margin-bottom:14px">
    <button class="type-chip ${shopShowDone?'active':''}" onclick="toggleShopShowDone()">Vis fullførte</button>
  </div>`;
  return toggleHtml + lists.map(list=>{
    const items=list.shopping_items||[];
    const done=items.filter(i=>i.done).length;
    const pct=items.length?Math.round(done/items.length*100):0;
    const visible=items.filter(i=>shopShowDone || !i.done || shopPending[i.id]).sort((a,b)=>a.sort_order-b.sort_order);
    const itemsHtml = visible.length ? visible.map(item=>{
      const isDone = item.done || shopPending[item.id];
      return `
        <div class="shop-item" data-shop-id="${item.id}">
          <button class="shop-check ${isDone?'checked':''}" onclick="${item.done?`uncheckShopItem('${item.id}')`:`checkShopItem('${item.id}','${escapeAttr(item.name)}')`}">${isDone?'✓':''}</button>
          <span class="shop-label ${isDone?'done':''}">${item.name}</span>
          ${item.qty?`<span class="shop-qty">${item.qty}</span>`:''}
        </div>`;
    }).join('') : `<div style="color:var(--muted);font-size:13px;font-weight:600;padding:8px 0">${items.length?'Alt kryssa av':'Ingen varer enno'}</div>`;
    return`<div class="card">
      <div class="card-title">${list.title}</div>
      <div class="prog-row"><div class="prog-bg"><div class="prog-fill" style="width:${pct}%"></div></div><span class="prog-text">${done}/${items.length}</span></div>
      ${itemsHtml}
      <div class="add-row">
        <input class="add-input" id="si_${list.id}" placeholder="Legg til vare" onkeydown="if(event.key==='Enter')addShopItem('${list.id}')">
        <button class="btn-sm" onclick="addShopItem('${list.id}')">+</button>
      </div>
    </div>`;
  }).join('');
}
function checkShopItem(id, name){
  const row = document.querySelector(`[data-shop-id="${id}"]`);
  if(row){
    row.classList.add('checking');
    const check = row.querySelector('.shop-check');
    if(check){ check.classList.add('checked'); check.textContent='✓'; }
    const label = row.querySelector('.shop-label');
    if(label) label.classList.add('done');
  }
  const timeoutId = setTimeout(async ()=>{
    delete shopPending[id];
    await sb(`shopping_items?id=eq.${id}`,{method:'PATCH',headers:HR,body:JSON.stringify({done:true})});
    renderTab('shopping');
  }, SHOP_UNDO_MS);
  shopPending[id] = timeoutId;
  toastUndo(`${name} kryssa av`, ()=>undoShopCheck(id), SHOP_UNDO_MS);
}
function undoShopCheck(id){
  clearTimeout(shopPending[id]);
  delete shopPending[id];

let recipesCache = [];
let recipeSearch = '';

function recipeMatches(r, q){
  return r.title.toLowerCase().includes(q) || (r.ingredients||'').toLowerCase().includes(q);
}
function recipeListHtml(recipes, q){
  const qq = q.trim().toLowerCase();
  const filtered = qq ? recipes.filter(r=>recipeMatches(r,qq)) : recipes;
  if(!filtered.length) return `<div style="color:var(--muted);font-size:13px;font-weight:600;padding:8px 0">${qq?'Ingen treff':'Ingen oppskrifter enno'}</div>`;
  return filtered.map(r=>`
    <div class="recipe-row" onclick="openRecipeDetail('${r.id}')">
      <span class="recipe-row-title">${escapeHtml(r.title)}</span>
      <span class="recipe-row-hint">›</span>
    </div>`).join('');
}
function filterRecipesUI(){
  recipeSearch = document.getElementById('recipeSearchInput')?.value || '';
  const listEl = document.getElementById('recipeList');

/* ── DAGSFORM (ope for alle å sjå, lagra per person per dag) ── */
const DAGSFORM_FLAGS = ['Sjuk','Pjusk','Mannesjuk','Magetrøbbel','Vondt i kroppen','Muskelverk','Vondt i ledd'];
const DAGSFORM_RATING_COLORS = ['','#D4607E','#E8854B','#E8B84B','#A9BE4A','#6DBF99','#3FA878'];
let dagsformDate = null;
let dagsformEditId = null;

function dfToday(){ return localDateStr(new Date()); }
function dfShiftDay(delta){
  const d = new Date(dagsformDate+'T12:00:00'); d.setDate(d.getDate()+delta);
  const s = localDateStr(d);
  if(s > dfToday()) return;
  dagsformDate = s; dagsformEditId = currentUser.id; renderTab('dagsform');
}
function dfSetDate(v){
  if(!v) return;
  dagsformDate = v > dfToday() ? dfToday() : v;
  dagsformEditId = currentUser.id;
  renderTab('dagsform');
}
function dfEditMember(id){ dagsformEditId = id; renderTab('dagsform'); }
function dfPickRating(btn){
  const was = btn.classList.contains('active');
  btn.parentElement.querySelectorAll('.dice-btn').forEach(b=>b.classList.remove('active'));
  if(!was) btn.classList.add('active');
}
function dfToggleFlag(btn){ btn.classList.toggle('active'); }

async function saveDagsform(){
  const memberId = dagsformEditId, date = dagsformDate;
  const rb = document.querySelector('#dfRating .dice-btn.active');
  const rating = rb ? Number(rb.dataset.v) : null;
  const flags = Array.from(document.querySelectorAll('#dfFlags .type-chip.active')).map(b=>b.dataset.flag);
  const note = document.getElementById('dfNote')?.value.trim() || null;
  if(!rating && !flags.length && !note){
    await sb(`daily_form?member_id=eq.${memberId}&date=eq.${date}`,{method:'DELETE',headers:H});
    toast('Dagsform fjerna');
  } else {
    await sb('daily_form?on_conflict=member_id,date',{
      method:'POST',
      headers:{...HR,'Prefer':'return=representation,resolution=merge-duplicates'},
      body:JSON.stringify({member_id:memberId,date,rating,flags,note,updated_at:new Date().toISOString()})
    });
    toast('Dagsform lagra');
  }
  dagsformEditId = currentUser.id;
  renderTab('dagsform');
}

function dfSummaryHtml(m, row){
  const c = memberColor(m.id);
  const canEditThis = m.id===currentUser.id || currentUser.is_admin;
  const rc = row && row.rating ? DAGSFORM_RATING_COLORS[row.rating] : null;
  return `<div class="df-member">
    <div class="df-member-head"><span class="df-dot" style="background:${c}"></span>${m.name}${canEditThis?`<span class="df-edit-link" onclick="dfEditMember('${m.id}')">${row?'Endre':'Registrer'}</span>`:''}${rc?`<span class="df-rating" style="background:${rc}22;border:1.5px solid ${rc};color:var(--charcoal)">Terningkast ${row.rating}</span>`:''}</div>
    ${row && row.flags && row.flags.length ? `<div class="df-flags">${row.flags.map(f=>`<span class="df-flag">${escapeHtml(f)}</span>`).join('')}</div>` : ''}
    ${row && row.note ? `<div class="df-note">${escapeHtml(row.note)}</div>` : ''}
    ${!row ? `<div class="df-empty">Ikkje registrert</div>` : ''}
  </div>`;
}

async function renderDagsform(){
  if(!dagsformDate) dagsformDate = dfToday();
  if(!dagsformEditId) dagsformEditId = currentUser.id;
  let rows = [];
  try { rows = await sb(`daily_form?date=eq.${dagsformDate}&select=*`); } catch(e) {}
  const byMember = {}; rows.forEach(r=>{ byMember[r.member_id]=r; });

  let editMember = members.find(m=>m.id===dagsformEditId) || currentUser;
  if(editMember.id!==currentUser.id && !currentUser.is_admin) editMember = currentUser;
  const cur = byMember[editMember.id] || null;
  const flagsOn = new Set(cur && cur.flags ? cur.flags : []);
  const isToday = dagsformDate === dfToday();
  const weekday = new Date(dagsformDate+'T12:00:00').toLocaleDateString('no',{weekday:'long'});
  const dayCaption = isToday ? 'I dag' : weekday;

  const others = members.filter(m=>m.id!==editMember.id);

  return `
  <div class="card">
    <div class="dinner-week-nav" style="margin-bottom:6px">
      <button class="date-arrow" onclick="dfShiftDay(-1)">‹</button>
      <input type="date" class="search-input" style="flex:1;text-align:center;font-weight:700" value="${dagsformDate}" max="${dfToday()}" onchange="dfSetDate(this.value)">
      <button class="date-arrow" onclick="dfShiftDay(1)" ${isToday?'disabled':''}>›</button>
    </div>
    <div class="df-label" style="text-align:center;margin:4px 0 0;text-transform:capitalize">${dayCaption}</div>
  </div>
  <div class="card">
    <div class="card-title">${editMember.id===currentUser.id?'Min dagsform':'Dagsform for '+editMember.name}</div>
    <div class="df-label">Dagsform (terningkast 1–6, 6 er best)</div>
    <div class="dice-row" id="dfRating">${[1,2,3,4,5,6].map(n=>`<button class="dice-btn ${cur&&cur.rating===n?'active':''}" data-v="${n}" onclick="dfPickRating(this)">${n}</button>`).join('')}</div>
    <div class="df-label">Kva plagar deg?</div>
    <div class="type-row" id="dfFlags" style="margin-bottom:14px">${DAGSFORM_FLAGS.map(f=>`<button class="type-chip ${flagsOn.has(f)?'active':''}" data-flag="${escapeAttr(f)}" onclick="dfToggleFlag(this)">${f}</button>`).join('')}</div>
    <div class="field"><label>Kort om dagsforma</label><textarea id="dfNote" placeholder="t.d. Litt trøytt etter trening, men ellers fin">${cur&&cur.note?escapeHtml(cur.note):''}</textarea></div>
    <button class="btn-save" onclick="saveDagsform()">Lagre</button>
  </div>
  <div class="card">
    <div class="card-title">Resten av familien</div>
    ${others.map(m=>dfSummaryHtml(m, byMember[m.id]||null)).join('')}
  </div>`;
}

function updateRecurringFields(){

  if(!el)return;
  const MONTH_NAMES=['Januar','Februar','Mars','April','Mai','Juni','Juli','August','September','Oktober','November','Desember'];
  const WD_NAMES=['Måndag','Tysdag','Onsdag','Torsdag','Fredag','Laurdag','Sundag'];
  if(type==='yearly') el.innerHTML=`
    <div class="field-row">
      <div class="field"><label>Månad</label><select id="rMo">${MONTH_NAMES.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('')}</select></div>
      <div class="field"><label>Dag i månaden</label><input type="number" id="rDom" value="1" min="1" max="31"></div>
    </div>`;
  else if(type==='monthly') el.innerHTML=`
    <div class="field"><label>Dag i månaden</label><input type="number" id="rDom" value="1" min="1" max="31" placeholder="t.d. 15"></div>`;
  else if(type==='interval_months') el.innerHTML=`
    <div class="field-row">
      <div class="field"><label>Kvar N. månad</label><input type="number" id="rN" value="3" min="1"></div>
      <div class="field"><label>Startdato</label><input type="date" id="rSd" value="${dateStr()}"></div>
    </div>`;
  else if(type==='interval_weeks') el.innerHTML=`
    <div class="field-row">
      <div class="field"><label>Kvar N. veke</label><input type="number" id="rN" value="4" min="1"></div>
      <div class="field"><label>Startdato</label><input type="date" id="rSd" value="${dateStr()}"></div>
    </div>`;
  else if(type==='weekly') el.innerHTML=`
    <div class="field"><label>Kva dag</label><select id="rDow">${WD_NAMES.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('')}</select></div>`;
  else if(type==='once') el.innerHTML=`
    <div class="field"><label>Dato</label><input type="date" id="rOd" value="${dateStr()}"></div>`;
  else el.innerHTML='';
}

async function saveRecurring(){
  const title=document.getElementById('rT')?.value.trim();if(!title){toast('Skriv inn tittel');return;}
  const pts=Number(document.getElementById('rP')?.value||10);
  const type=document.getElementById('rRt')?.value;
  const assigned_to=document.getElementById('rA')?.value||null;
  const body={title,pts,recurrence_type:type,assigned_to:assigned_to||null,active:true};
  if(type==='yearly'){ body.month=Number(document.getElementById('rMo')?.value); body.day_of_month=Number(document.getElementById('rDom')?.value); }
  if(type==='monthly'){ body.day_of_month=Number(document.getElementById('rDom')?.value); }
  if(type==='interval_months'||type==='interval_weeks'){ body.interval_n=Number(document.getElementById('rN')?.value); body.start_date=document.getElementById('rSd')?.value; }
  if(type==='weekly'){ body.day_of_week=Number(document.getElementById('rDow')?.value); }
  if(type==='once'){ body.once_date=document.getElementById('rOd')?.value; }
  await sb('recurring_tasks',{method:'POST',headers:HR,body:JSON.stringify(body)});
  closeModal();toast('Oppgåve lagt til!');renderTab('admin');
}

function showTaskModal(){
  document.getElementById('modal').innerHTML=`
  <div class="backdrop" onclick="if(event.target===this)closeModal()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Ny oppgåve</div>
      <div class="field"><label>Tittel</label><input id="mT" placeholder="Kva skal gjerast?"></div>
      <div class="field"><label>Type</label>
        <div class="type-row">
          ${TASK_TYPES.map(t=>`<button class="type-chip ${t.v==='once'?'active':''}" onclick="selType(this,'${t.v}')">${t.l}</button>`).join('')}
          <input type="hidden" id="mTy" value="once">
        </div>
      </div>
      <div class="field"><label>Tildel til</label>
        <select id="mAs"><option value="">Felles (alle)</option>${members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select>
      </div>
      <div class="field" id="mDF"><label>Frist</label><input type="date" id="mDu"></div>
      <div class="field"><label>Poeng</label><input type="number" id="mPt" value="10" min="0"></div>
      <button class="btn-save" onclick="saveTask()">Lagre</button>
      <button class="btn-cancel-s" onclick="closeModal()">Avbryt</button>
    </div>
  </div>`;
}
function selType(btn,val){
  btn.closest('.type-row').querySelectorAll('.type-chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');document.getElementById('mTy').value=val;
  const df=document.getElementById('mDF');if(df)df.style.display=val==='once'?'block':'none';
}
async function saveTask(){
  const title=document.getElementById('mT')?.value.trim();if(!title){toast('Skriv inn tittel');return;}
  await sb('tasks',{method:'POST',headers:HR,body:JSON.stringify({
    title,type:document.getElementById('mTy')?.value||'once',
    assigned_to:document.getElementById('mAs')?.value||null,
    due_date:document.getElementById('mDu')?.value||null,
    pts:Number(document.getElementById('mPt')?.value||0),done:false
  })});
  closeModal();toast('Oppgåve lagt til');renderTab('chores');
}

function showShopModal(){
  document.getElementById('modal').innerHTML=`
  <div class="backdrop" onclick="if(event.target===this)closeModal()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Ny handleliste</div>
      <div class="field"><label>Namn</label><input id="sT" placeholder="t.d. Vekehandel"></div>
      <div class="field"><label>Varer (éi per linje)</label><textarea id="sI" placeholder="Mjølk&#10;Brød&#10;Egg"></textarea></div>
      <button class="btn-save" onclick="saveShop()">Opprett</button>
      <button class="btn-cancel-s" onclick="closeModal()">Avbryt</button>
    </div>
  </div>`;
}
async function saveShop(){
  const title=document.getElementById('sT')?.value.trim();if(!title){toast('Skriv inn namn');return;}
  const list=await sb('shopping_lists',{method:'POST',headers:HR,body:JSON.stringify({title})});
  const listId=list[0].id;
  const raw=document.getElementById('sI')?.value||'';
  const items=raw.split('\n').map(s=>s.trim()).filter(Boolean).map((n,i)=>({list_id:listId,name:n,qty:'',done:false,sort_order:i}));
  if(items.length)await sb('shopping_items',{method:'POST',headers:HR,body:JSON.stringify(items)});
  closeModal();toast('Handleliste oppretta');renderTab('shopping');
}

/* ── CHAT ── */
let chatPollTimer = null;
let lastChatRenderCount = 0;

async function renderChat(){
  const msgs = await sb('messages?select=*&order=created_at.asc&limit=200');
  lastChatRenderCount = msgs.length;
  return `
  <div class="chat-wrap" style="height:calc(100dvh - 230px)">
    <div class="chat-messages" id="chatMessages">
      ${renderChatMessages(msgs)}
    </div>
    <div class="chat-input-row">
      <input class="chat-input" id="chatInput" placeholder="Skriv ei melding…" onkeydown="if(event.key==='Enter')sendChatMessage()">
      <button class="chat-send" onclick="sendChatMessage()">➤</button>
    </div>
  </div>`;
}

function renderChatMessages(msgs){
  if (!msgs.length) return `<div class="chat-empty">Ingen meldingar enno.<br>Send den første!</div>`;
  let html = '';
  let lastDay = '';
  msgs.forEach(m => {
    const d = new Date(m.created_at);
    const dayKey = d.toLocaleDateString('no', {weekday:'long', day:'numeric', month:'long'});
    if (dayKey !== lastDay) {
      html += `<div class="chat-day-divider">${dayKey}</div>`;
      lastDay = dayKey;
    }
    const sender = members.find(mem => mem.id === m.user_id);
    const mine = m.user_id === currentUser.id;
    const time = d.toLocaleTimeString('no', {hour:'2-digit', minute:'2-digit'});
    html += `
      <div class="chat-bubble-row ${mine?'mine':'theirs'}">
        ${!mine ? `<div class="chat-sender">${sender?sender.name:'?'}</div>` : ''}
        <div class="chat-bubble">${escapeHtml(m.text)}</div>
        <div class="chat-time">${time}</div>
      </div>`;
  });
  return html;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function scrollChatToBottom(){
  setTimeout(() => {
    const el = document.getElementById('chatMessages');
    if (el) el.scrollTop = el.scrollHeight;
  }, 60);
}

async function sendChatMessage(){
  const inp = document.getElementById('chatInput');
  const text = inp?.value.trim();
  if (!text) return;
  inp.value = '';
  try {
    await sb('messages', {method:'POST', headers:HR, body:JSON.stringify({user_id:currentUser.id, text})});
  } catch(e) {
    toast('Kunne ikkje sende melding');
    return;
  }
  if (currentTab === 'chat') {
    const msgs = await sb('messages?select=*&order=created_at.asc&limit=200');
    lastChatRenderCount = msgs.length;
    const el = document.getElementById('chatMessages');
    if (el) { el.innerHTML = renderChatMessages(msgs); scrollChatToBottom(); }
  }
}

/* Poll for new chat messages every 3s while chat tab is open */
function setupChatRealtime(){
  teardownChatRealtime();
  chatPollTimer = setInterval(async () => {
    if (currentTab !== 'chat') return;
    try {
      const msgs = await sb('messages?select=*&order=created_at.asc&limit=200');
      if (msgs.length !== lastChatRenderCount) {
        lastChatRenderCount = msgs.length;
        const el = document.getElementById('chatMessages');
        if (el) {
          const wasAtBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
          el.innerHTML = renderChatMessages(msgs);
          if (wasAtBottom) scrollChatToBottom();
        }
      }
    } catch(e) { /* silent fail on poll */ }
  }, 3000);
}
function teardownChatRealtime(){
  if (chatPollTimer) { clearInterval(chatPollTimer); chatPollTimer = null; }
}

function closeModal(){document.getElementById('modal').innerHTML='';}

let _tt;
function toast(msg){
  clearTimeout(_tt);
  _toastUndoCallback=null;
  document.getElementById('toastEl').innerHTML=`<div class="toast">${msg}</div>`;
  _tt=setTimeout(()=>{document.getElementById('toastEl').innerHTML='';},2900);
}

let _toastUndoCallback=null;
function toastUndo(msg, onUndo, ms){
  clearTimeout(_tt);
  _toastUndoCallback = onUndo;
  document.getElementById('toastEl').innerHTML=`<div class="toast toast-undo"><span>${msg}</span><button class="toast-undo-btn" onclick="runToastUndo()">Angre</button></div>`;
  _tt=setTimeout(()=>{document.getElementById('toastEl').innerHTML='';_toastUndoCallback=null;},(ms||4000)+300);
}
function runToastUndo(){
  if(_toastUndoCallback) _toastUndoCallback();
  _toastUndoCallback=null;
  clearTimeout(_tt);
  document.getElementById('toastEl').innerHTML='';
}

init();
</script>
